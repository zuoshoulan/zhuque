# Redis配置文件 - 开发环境

# 绑定地址
bind 0.0.0.0

# 端口
port 6379

# 守护进程（Docker环境关闭）
daemonize no

# 持久化配置
appendonly yes
appendfsync everysec

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志级别
loglevel notice

# 数据库数量
databases 16

# RDB配置
save 900 1
save 300 10
save 60 10000

# RDB文件名
dbfilename dump.rdb

# 工作目录
dir /data

# 密码（开发环境无密码，生产环境必须设置）
# requirepass yourpassword

# 慢查询配置
slowlog-log-slower-than 10000
slowlog-max-len 128
