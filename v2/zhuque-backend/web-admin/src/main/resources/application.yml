spring:
  application:
    name: zhuque-admin

  profiles:
    active: dev

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    wake.su.zhuque: DEBUG

# 超级管理员配置
# 通过配置文件指定受保护的用户ID列表
# 这些用户ID对应的数据将被保护，禁止删除和禁用
super-admin:
  # 是否启用超级管理员保护
  enabled: true
  # 超级管理员的用户ID列表
  # 注意：这些用户ID必须在数据库中存在
  user-ids:
    - 3  # admin用户（默认超级管理员）
    - 5
    - 6

# Security 配置
security:
  # 允许匿名访问的路径
  permit-all:
    paths:
      - /api/hello
      - /api/health
      - /api/auth/login
      - /api/auth/logout
      - /api/test/**
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error
      - /webjars/**

# SpringDoc OpenAPI (Swagger) 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha           # 按字母顺序排序Tag
    operations-sorter: alpha     # 按字母顺序排序操作
    display-request-duration: true  # 显示请求耗时
    display-operation-id: true   # 显示操作ID
  show-actuator: false          # 不显示actuator端点
  group-configs:
    - group: 'zhuque-api'
      paths-to-match: '/api/**'
      packages-to-scan: 'wake.su.zhuque.controller'
  default-flat-param-object: false  # 禁用扁平化参数对象
