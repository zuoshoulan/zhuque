spring:
  application:
    name: zhuque-admin

  profiles:
    active: dev

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    wake.su.zhuque: DEBUG

# Security 配置
security:
  # 允许匿名访问的路径
  permit-all:
    paths:
      - /api/hello
      - /api/health
      - /actuator/**
      - /error
